openapi: 3.0.3
info:
  title: NITICSR OS API
  version: "1.0"
  description: >
    Core Phase 2 REST API. All endpoints require a valid Clerk session
    (cookie-based for the web app, or a future API-key scheme for
    server-to-server use — see docs/ARCHITECTURE.md roadmap). Every
    write is checked against the caller's permission-based role for the
    organization being acted on.


    Versioning policy (ERT 11): the `/api/v1` prefix is the only version
    that exists today — there is no v2, so there is nothing to deprecate
    yet. When a breaking change to a v1 endpoint is unavoidable, the
    convention is: add the new shape as a new endpoint or an additive field
    rather than breaking the existing response first; if an endpoint must
    be retired, it gets a `Deprecation: true` and `Sunset: <date>` response
    header for at least one release cycle before removal, and a note is
    added to this file's `description` for that path. No endpoint has been
    deprecated under this policy yet — it's documented now, ahead of the
    first real deprecation, rather than improvised later.
servers:
  - url: /api/v1
security:
  - clerkSession: []
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        issues: { nullable: true }
    Envelope:
      type: object
      properties:
        data: {}
        meta: { nullable: true, type: object }
    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        type: { type: string, enum: [corporate, ngo, auditor] }
        role: { type: string }
    NgoProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        legal_name: { type: string }
        registration_number: { type: string, nullable: true }
        registration_type: { type: string, enum: [trust, society, section8], nullable: true }
        headquarters_state: { type: string, nullable: true }
        operating_states: { type: array, items: { type: string } }
        cause_category_keys: { type: array, items: { type: string } }
    CsrProject:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status:
          type: string
          enum: [draft, proposed, approved, active, completed, cancelled]
        budget_amount: { type: number, nullable: true }
        corporate_org_id: { type: string, format: uuid }
        ngo_profile_id: { type: string, format: uuid, nullable: true }
    VerificationRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, in_review, approved, rejected] }
        ngo_profile_id: { type: string, format: uuid }
        review_notes: { type: string, nullable: true }
paths:
  /organizations/{id}/search:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: >
        Enterprise search (requires CSR.Project.Read) — Postgres full-text
        search (tsvector/ts_rank) across the organization's own projects,
        governance policies, risks/issues, and incidents. Keyword/stem-based
        ranking, not semantic retrieval over an embedding corpus.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }

  /feature-flags:
    get:
      summary: >
        List feature flags (requires Organization.Read on organizationId) —
        every global default plus the caller's own organization's override,
        with the effective value already resolved. Pass `key` to check a
        single flag instead of listing all.
      parameters:
        - { name: organizationId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: key, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: OK }
    patch:
      summary: >
        Set a flag's value. Org-scoped (organizationId in the body) requires
        Organization.Write on that org. Global (organizationId omitted)
        requires Platform.FeatureFlag.Manage, checked across any
        organization the caller belongs to, since it changes what every
        tenant without its own override inherits.
      responses:
        "200": { description: OK }

  /organizations/{id}/sdg-rollup:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: >
        Per-SDG rollup (requires CSR.Project.Read): project count, budget,
        and beneficiary totals for each of the 17 UN goals, aggregated
        from each project's own SDG tagging. No fabricated composite
        sustainability score.
      responses:
        "200": { description: OK }

  /organizations/{id}/social-impact-summary:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: >
        Beneficiary totals by category, alongside an indicative
        CSR-category-to-BRSR-principle cross-reference (requires
        CSR.Project.Read). The BRSR mapping is a static, factual SEBI
        NGRBC taxonomy reference, not an official crosswalk.
      responses:
        "200": { description: OK }

  /organizations/{id}/alerts:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: >
        Continuous controls monitoring feed (requires CSR.Project.Read) —
        unifies compliance/document/geofence/transfer/CAPA/beneficiary
        checks plus two statistical anomaly checks into one list. Computed
        fresh on every request, nothing persisted or scored.
      responses:
        "200": { description: OK }

  /organizations/{id}/risks:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List the organization-wide risk register (requires CSR.Project.Read)
      responses:
        "200": { description: OK }
    post:
      summary: >
        Log a risk or issue, optionally linked to a project (requires
        CSR.Project.Write).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entryType, title]
              properties:
                entryType: { type: string, enum: [risk, issue] }
                title: { type: string }
                description: { type: string }
                severity: { type: string, enum: [low, medium, high] }
                csrProjectId: { type: string, format: uuid }
      responses:
        "200": { description: Created }

  /risks/{riskId}:
    parameters:
      - { name: riskId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: >
        Update a risk/issue's status or severity (requires
        CSR.Project.Write). Works for both project-scoped and
        organization-wide entries.
      responses:
        "200": { description: Updated }

  /organizations/{id}/controls:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List the organization's controls library (requires CSR.Project.Read)
      responses:
        "200": { description: OK }
    post:
      summary: Add a control (requires CSR.Project.Write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, controlType]
              properties:
                name: { type: string }
                description: { type: string }
                controlType: { type: string, enum: [preventive, detective, corrective] }
                frequency: { type: string, enum: [continuous, daily, weekly, monthly, quarterly, annual] }
                linkedRiskId: { type: string, format: uuid }
      responses:
        "200": { description: Created }

  /controls/{controlId}:
    parameters:
      - { name: controlId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Update a control's review frequency (requires CSR.Project.Write)
      responses:
        "200": { description: Updated }

  /organizations/{id}/audit-engagements:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List audit engagements (requires CSR.Project.Read)
      responses:
        "200": { description: OK }
    post:
      summary: Create an audit engagement (requires CSR.Project.Write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                scope: { type: string }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
      responses:
        "200": { description: Created }

  /audit-engagements/{engagementId}:
    parameters:
      - { name: engagementId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Update an audit engagement's status (requires CSR.Project.Write)
      responses:
        "200": { description: Updated }

  /organizations/{id}/capa-items:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List corrective action items (requires CSR.Project.Read)
      responses:
        "200": { description: OK }
    post:
      summary: >
        Create a corrective action, optionally linked to an audit
        engagement or a risk (requires CSR.Project.Write). A finding and
        its remediation are captured together here rather than as a
        separate "finding" entity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                auditEngagementId: { type: string, format: uuid }
                projectRiskId: { type: string, format: uuid }
                dueDate: { type: string, format: date }
      responses:
        "200": { description: Created }

  /capa-items/{capaId}:
    parameters:
      - { name: capaId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Update a corrective action's status (requires CSR.Project.Write)
      responses:
        "200": { description: Updated }

  /organizations/{id}/incidents:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List incidents (requires CSR.Project.Read)
      responses:
        "200": { description: OK }
    post:
      summary: Log an incident (requires CSR.Project.Write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, description]
              properties:
                category:
                  type: string
                  enum: [safety, fraud, data_breach, beneficiary_complaint, reputational, regulatory, other]
                severity: { type: string, enum: [low, medium, high] }
                description: { type: string }
                csrProjectId: { type: string, format: uuid }
                fiveWhys: { type: array, items: { type: string }, maxItems: 5 }
      responses:
        "200": { description: Created }

  /incidents/{incidentId}:
    parameters:
      - { name: incidentId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Update an incident's status or Five Whys (requires CSR.Project.Write)
      responses:
        "200": { description: Updated }

  /csr-projects/{id}/field-visits:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List a project's field check-ins (requires CSR.Project.Read)
      responses:
        "200": { description: OK }
    post:
      summary: >
        Record a GPS check-in (requires CSR.Project.Write). Distance and
        geofence pass/fail are computed against the project's registered
        locations using the same Haversine expression as the NGO/project
        radius search (see ADR 0002) — null if the project has no
        registered location to check against.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude: { type: number }
                longitude: { type: number }
                note: { type: string }
      responses:
        "200": { description: Created }

  /csr-projects/{id}/assets:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List a project's asset register (requires CSR.Project.Read)
      responses:
        "200": { description: OK }
    post:
      summary: Add an asset (requires CSR.Project.Write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                latitude: { type: number }
                longitude: { type: number }
                evidenceUrl: { type: string, format: uri }
      responses:
        "200": { description: Created }

  /csr-projects/{id}/assets/{assetId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Update an asset's status or evidence link (requires CSR.Project.Write)
      responses:
        "200": { description: Updated }

  /csr-projects/{id}/qr-code:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: >
        An inline SVG QR code linking to this project's detail page
        (requires CSR.Project.Read) — generated locally, no external API.
      responses:
        "200": { description: OK, content: { image/svg+xml: {} } }

  /organizations/{id}/surveys:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List an organization's survey definitions (requires CSR.Project.Read)
      responses:
        "200": { description: OK }
    post:
      summary: Create a survey definition (requires CSR.Project.Write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, questions]
              properties:
                title: { type: string }
                description: { type: string }
                questions:
                  type: array
                  items:
                    type: object
                    required: [key, label, type]
                    properties:
                      key: { type: string }
                      label: { type: string }
                      type: { type: string, enum: [text, number, choice] }
                      required: { type: boolean }
                      options: { type: array, items: { type: string } }
      responses:
        "200": { description: Created }

  /surveys/{id}/responses:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List a survey's responses (requires CSR.Project.Read)
      responses:
        "200": { description: OK }
    post:
      summary: >
        Submit a survey response (requires CSR.Project.Write). Answers are
        validated against the survey's question definitions before insert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                csrProjectId: { type: string, format: uuid }
                beneficiaryId: { type: string, format: uuid }
                answers: { type: object }
      responses:
        "200": { description: Created }

  /organizations/{id}/programs:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List an organization's programs (requires CSR.Project.Read)
      responses:
        "200": { description: OK }
    post:
      summary: Create a program to group related projects (requires CSR.Project.Write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "200": { description: Created }

  /organizations/{id}/portfolio:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: >
        Portfolio rollup (requires CSR.Project.Read): total programs,
        total projects, projects/budget by status, and per-program totals.
      responses:
        "200": { description: OK }

  /csr-projects/{id}/milestones:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List a project's milestones (requires CSR.Project.Read)
      responses:
        "200": { description: OK }
    post:
      summary: >
        Create a milestone (requires CSR.Project.Write) — the CRUD API the
        `milestones` table has never had since it was added in Phase 2.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                dueDate: { type: string, format: date }
      responses:
        "200": { description: Created }

  /csr-projects/{id}/milestones/{milestoneId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: milestoneId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Update a milestone, including status (requires CSR.Project.Write)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                dueDate: { type: string, format: date }
                status: { type: string, enum: [pending, in_progress, completed, delayed] }
                evidenceUrl: { type: string, format: uri }
      responses:
        "200": { description: Updated }

  /csr-projects/{id}/milestones/{milestoneId}/tasks:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: milestoneId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List a milestone's sub-tasks (requires CSR.Project.Read)
      responses:
        "200": { description: OK }
    post:
      summary: Add a sub-task to a milestone (requires CSR.Project.Write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
      responses:
        "200": { description: Created }

  /csr-projects/{id}/milestones/{milestoneId}/tasks/{taskId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: milestoneId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Toggle a sub-task done/pending (requires CSR.Project.Write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending, done] }
      responses:
        "200": { description: Updated }

  /csr-projects/{id}/milestones/{milestoneId}/dependencies:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: milestoneId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List a milestone's dependencies (requires CSR.Project.Read)
      responses:
        "200": { description: OK }
    post:
      summary: >
        Add a "depends on" link to another milestone on the same project
        (requires CSR.Project.Write). Rejected if it would create a cycle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dependsOnMilestoneId]
              properties:
                dependsOnMilestoneId: { type: string, format: uuid }
      responses:
        "200": { description: Created }

  /csr-projects/{id}/timeline:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: >
        A real timeline visualization of milestones positioned between the
        project's start and end date (requires CSR.Project.Read).
      responses:
        "200": { description: OK }

  /csr-projects/{id}/risks:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List a project's risk/issue log (requires CSR.Project.Read)
      responses:
        "200": { description: OK }
    post:
      summary: Log a risk or issue (requires CSR.Project.Write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entryType, title]
              properties:
                entryType: { type: string, enum: [risk, issue] }
                title: { type: string }
                description: { type: string }
                severity: { type: string, enum: [low, medium, high] }
      responses:
        "200": { description: Created }

  /csr-projects/{id}/risks/{riskId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: riskId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Update a risk/issue's status or severity (requires CSR.Project.Write)
      responses:
        "200": { description: Updated }

  /csr-projects/{id}/change-requests:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List a project's change requests (requires CSR.Project.Read)
      responses:
        "200": { description: OK }
    post:
      summary: Propose a budget or end-date change (requires CSR.Project.Write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [field, requestedValue]
              properties:
                field: { type: string, enum: [budget_amount, end_date] }
                requestedValue: { type: string }
                reason: { type: string }
      responses:
        "200": { description: Created }

  /csr-projects/{id}/change-requests/{changeRequestId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: changeRequestId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: >
        Approve or reject a pending change request (requires
        CSR.Project.Approve — the same authority as the original project
        approval). Applying the change updates the project directly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [approved, rejected] }
      responses:
        "200": { description: Updated }

  /organizations/{id}/annual-budgets:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List an organization's declared annual CSR budgets by fiscal year (requires CSR.Project.Read)
      responses:
        "200": { description: OK }
    post:
      summary: Create or update the annual CSR budget for a fiscal year (requires CSR.Project.Write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fiscalYear, budgetAmount]
              properties:
                fiscalYear: { type: string, example: "2025-26" }
                budgetAmount: { type: number }
      responses:
        "200": { description: Upserted }

  /organizations/{id}/fund-utilization:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: >
        Aggregate fund utilization for a fiscal year (requires CSR.Project.Read):
        annual budget, disbursed-in-FY, total allocated across projects, and
        pending unspent-fund transfers.
      parameters:
        - { name: fiscalYear, in: query, schema: { type: string, example: "2025-26" } }
      responses:
        "200": { description: OK }

  /organizations/{id}/unspent-fund-transfers:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List an organization's Section 135(5)/(6) unspent-fund transfer obligations (requires CSR.Project.Read)
      responses:
        "200": { description: OK }

  /unspent-fund-transfers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Mark an unspent-fund transfer complete (requires CSR.Project.Write)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                transferReference: { type: string }
      responses:
        "200": { description: Updated }

  /csr-projects/{id}/forecast:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: >
        An honest linear disbursement-pace projection (requires CSR.Project.Read).
        Returns null with fewer than two disbursements recorded — never a
        fabricated forecast.
      responses:
        "200": { description: OK }

  /csr-projects/{id}/reviews:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List structured proposal review notes (requires CSR.Project.Read)
      responses:
        "200": { description: OK }
    post:
      summary: Add a proposal review note (requires CSR.Project.Write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recommendation]
              properties:
                recommendation: { type: string, enum: [recommend, recommend_with_conditions, not_recommend] }
                notes: { type: string }
      responses:
        "200": { description: Created }

  /csr-projects/{id}/score:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: >
        Computed proposal readiness score (requires CSR.Project.Read) —
        blends deterministic readiness checks with the implementing NGO's
        real trust score when one exists; cost-per-beneficiary is returned
        as an informational figure only, never scored (no benchmark data
        exists to judge it against).
      responses:
        "200": { description: OK }

  /csr-projects/{id}/agreement:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: >
        Get the grant agreement terms and acknowledgement status (requires
        CSR.Project.Read in the corporate org OR NGO.Profile.Read in the
        implementing NGO's org — both sides of the partnership can read it).
      responses:
        "200": { description: OK }
    patch:
      summary: >
        Create or update the agreement's terms (requires CSR.Project.Write).
        Editing terms after acknowledgement clears the acknowledgement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [terms]
              properties:
                terms: { type: string }
      responses:
        "200": { description: Upserted }

  /csr-projects/{id}/agreement/acknowledge:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: >
        The implementing NGO acknowledges the agreement's current terms
        (requires NGO.Profile.Write in the NGO's own organization — a
        cross-tenant action, not a legal e-signature).
      responses:
        "200": { description: Acknowledged }

  /csr-projects/{id}/disbursements:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List disbursement ledger entries + running total/remaining/percent-used (requires CSR.Project.Read)
      responses:
        "200": { description: OK }
    post:
      summary: >
        Record a disbursement against budget (requires CSR.Project.Write).
        A bookkeeping ledger entry, not real payment execution — rejected
        if it would exceed the project's budget.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                milestoneId: { type: string, format: uuid }
                amount: { type: number }
                note: { type: string }
                vendorName: { type: string }
                expenseCategory: { type: string }
                invoiceReference: { type: string }
      responses:
        "200": { description: Created }

  /csr-projects/{id}/renew:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: >
        Create a new draft project linked to this one via
        renewed_from_project_id (requires CSR.Project.Write). Only
        available once the original project's status is 'completed'.
      responses:
        "200": { description: Created }

  /ngo-profiles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: >
        NGO 360 view (requires NGO.Profile.Read in any organization): full
        profile, documents, per-provider verification breakdown, aggregate
        (not per-project) partnership stats, and an honestly-computed trust
        score — components with no real data source (financial, governance,
        audit) are returned null rather than estimated.
      responses:
        "200": { description: OK }

  /organizations/{id}/ngo-profile/documents:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List an NGO's own documents (requires NGO.Profile.Read)
      responses:
        "200": { description: OK }
    post:
      summary: Add a document record for the NGO's own profile (requires NGO.Profile.Write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentType]
              properties:
                documentType:
                  type: string
                  enum: [12A, 80G, FCRA, CSR1, PAN, REGISTRATION_CERTIFICATE, OTHER]
                fileUrl: { type: string, format: uri }
                issuedAt: { type: string, format: date }
                expiresAt: { type: string, format: date }
      responses:
        "200": { description: Created }

  /ngo-documents/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: >
        Verify or reject an NGO document (requires NGO.Verify in the
        reviewer's own organization — cross-tenant review, same pattern as
        verification-requests).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, status]
              properties:
                organizationId: { type: string, format: uuid }
                status: { type: string, enum: [verified, rejected] }
      responses:
        "200": { description: Updated }

  /csr-projects/{id}/compliance:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: >
        Get a project's compliance posture (requires CSR.Project.Read):
        deterministic data-completeness checks, regulatory obligations, and
        a blended 0-100 score.
      responses:
        "200": { description: OK }

  /compliance-obligations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Mark a compliance obligation satisfied or waived (requires Compliance.Obligation.Write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [satisfied, waived] }
      responses:
        "200": { description: Updated }

  /organizations/{id}/compliance-summary:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: >
        Aggregate compliance score and obligation counts across every
        non-draft CSR project in the organization (requires
        Compliance.Obligation.Read).
      responses:
        "200": { description: OK }

  /governance/decisions:
    get:
      summary: List the immutable governance decision log (requires Governance.Decision.Read)
      parameters:
        - { name: organizationId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        "200": { description: OK }

  /governance/policies:
    get:
      summary: List an organization's governance policies (requires Governance.Policy.Read)
      parameters:
        - { name: organizationId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
    post:
      summary: Create a draft policy (requires Governance.Policy.Write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, title, content]
              properties:
                organizationId: { type: string, format: uuid }
                title: { type: string }
                category: { type: string }
                content: { type: string }
                effectiveDate: { type: string, format: date }
                reviewDate: { type: string, format: date }
      responses:
        "200": { description: Created }

  /governance/policies/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get a policy (requires Governance.Policy.Read)
      responses:
        "200": { description: OK }
    patch:
      summary: >
        Update a policy (requires Governance.Policy.Write). Editing content
        increments its version number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                category: { type: string }
                content: { type: string }
                status: { type: string, enum: [draft, active, superseded, retired] }
                effectiveDate: { type: string, format: date }
                reviewDate: { type: string, format: date }
      responses:
        "200": { description: Updated }

  /governance/policies/{id}/acknowledge:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Record the caller's acknowledgement of a policy (requires Governance.Policy.Read)
      responses:
        "200": { description: Acknowledged }

  /delegations:
    get:
      summary: List delegations for an organization (requires Organization.Read)
      parameters:
        - { name: organizationId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
    post:
      summary: >
        Delegate one of your own permissions to a colleague for a time
        window (requires Governance.Delegation.Manage; you must already
        hold the permission being delegated).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, delegateUserId, permissionKey, endsAt]
              properties:
                organizationId: { type: string, format: uuid }
                delegateUserId: { type: string, format: uuid }
                permissionKey: { type: string }
                endsAt: { type: string, format: date-time }
      responses:
        "200": { description: Created }

  /delegations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Revoke a delegation (requires Governance.Delegation.Manage)
      responses:
        "200": { description: Revoked }

  /organizations/{id}/members:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List an organization's members (requires Organization.Read)
      responses:
        "200": { description: OK }

  /ngo-profiles:
    get:
      summary: >
        Browse the NGO directory (requires NGO.Profile.Read in any
        organization you belong to — this is a cross-tenant read, not
        scoped to a single acting organization).
      description: >
        Supports the same optional lat/lng/radiusKm Haversine radius search
        as GET /csr-projects, plus state and causeCategoryKey filters.
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: causeCategoryKey, in: query, schema: { type: string } }
        - { name: lat, in: query, schema: { type: number } }
        - { name: lng, in: query, schema: { type: number } }
        - { name: radiusKm, in: query, schema: { type: number } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        "200": { description: OK }

  /organizations:
    get:
      summary: List organizations the current user belongs to
      parameters:
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Organization" }
    post:
      summary: Create an organization (creator becomes its admin/owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, type]
              properties:
                name: { type: string }
                slug: { type: string, pattern: "^[a-z0-9-]+$" }
                type: { type: string, enum: [corporate, ngo, auditor] }
      responses:
        "200": { description: Created }
        "409": { description: Slug already taken }

  /organizations/{id}/ngo-profile:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get an organization's NGO profile (requires NGO.Profile.Read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/NgoProfile" } }
        "403": { description: Missing permission }
        "404": { description: No profile yet }
    patch:
      summary: Create or update an organization's NGO profile (requires NGO.Profile.Write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalName]
              properties:
                legalName: { type: string }
                registrationNumber: { type: string }
                registrationType: { type: string, enum: [trust, society, section8] }
                pan: { type: string }
                establishedYear: { type: integer }
                description: { type: string }
                website: { type: string, format: uri }
                headquartersState: { type: string }
                operatingStates: { type: array, items: { type: string } }
                causeCategoryKeys: { type: array, items: { type: string } }
      responses:
        "200": { description: Upserted }

  /csr-projects:
    get:
      summary: List CSR projects for an organization (requires CSR.Project.Read)
      description: >
        Supports an optional radius search (lat + lng + radiusKm, all three
        required together) computed with a plain Haversine formula over
        project_locations — no PostGIS required at this scale. When present,
        results are ordered by distance and include a distance_km field.
      parameters:
        - { name: organizationId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, oldest] } }
        - { name: lat, in: query, schema: { type: number }, description: "Requires lng and radiusKm" }
        - { name: lng, in: query, schema: { type: number }, description: "Requires lat and radiusKm" }
        - { name: radiusKm, in: query, schema: { type: number }, description: "Requires lat and lng" }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/CsrProject" }
    post:
      summary: Create a CSR project (requires CSR.Project.Write on corporateOrgId)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [corporateOrgId, csrCategoryKey, title]
              properties:
                corporateOrgId: { type: string, format: uuid }
                ngoProfileId: { type: string, format: uuid }
                csrCategoryKey: { type: string }
                title: { type: string }
                description: { type: string }
                budgetAmount: { type: number }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
      responses:
        "200": { description: Created }

  /csr-projects/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get a CSR project with locations and milestones (requires CSR.Project.Read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties: { data: { $ref: "#/components/schemas/CsrProject" } }
    patch:
      summary: >
        Update a CSR project (requires CSR.Project.Write; setting status to
        "approved" additionally requires CSR.Project.Approve)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                budgetAmount: { type: number }
                status: { type: string, enum: [draft, proposed, approved, active, completed, cancelled] }
                ngoProfileId: { type: string, format: uuid }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
      responses:
        "200": { description: Updated }

  /csr-projects/{id}/sdgs:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Replace a project's SDG mapping (requires CSR.Project.Write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sdgIds]
              properties:
                sdgIds: { type: array, items: { type: integer, minimum: 1, maximum: 17 } }
      responses:
        "200": { description: Replaced }

  /csr-projects/{id}/locations:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Add a project location (requires CSR.Project.Write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string }
                district: { type: string }
                latitude: { type: number }
                longitude: { type: number }
      responses:
        "200": { description: Created }

  /csr-projects/{id}/beneficiaries:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Add a beneficiary group to a project (requires CSR.Project.Write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category]
              properties:
                category: { type: string }
                countEstimate: { type: integer, minimum: 0 }
                demographicNotes: { type: string }
      responses:
        "200": { description: Created }

  /verification-requests:
    get:
      summary: >
        List verification requests. For an NGO organization, lists that
        NGO's own requests (requires NGO.Profile.Read). For an auditor
        organization, lists the platform-wide review queue (requires
        Verification.Review).
      parameters:
        - { name: organizationId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/VerificationRequest" }
    post:
      summary: Submit a verification request for an NGO profile (requires Verification.Submit)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ngoProfileId, organizationId]
              properties:
                ngoProfileId: { type: string, format: uuid }
                organizationId: { type: string, format: uuid, description: "The NGO's own organization" }
      responses:
        "200": { description: Created }

  /verification-requests/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: >
        Review or approve/reject a verification request, acting as an
        auditor organization. status="in_review" requires
        Verification.Review; "approved"/"rejected" requires
        Verification.Approve.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, status]
              properties:
                organizationId: { type: string, format: uuid, description: "The auditor's own organization" }
                status: { type: string, enum: [in_review, approved, rejected] }
                reviewNotes: { type: string }
      responses:
        "200": { description: Updated }

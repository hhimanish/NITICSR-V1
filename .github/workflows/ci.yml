name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: niticsr
          POSTGRES_PASSWORD: niticsr
          POSTGRES_DB: niticsr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U niticsr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://niticsr:niticsr@localhost:5432/niticsr_test

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run database migrations
        run: npm run db:migrate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code; then
            echo "ESLint or formatting would make changes — run locally and commit:"
            echo "  npm run lint"
            exit 1
          fi
